services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-photo-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_photo_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ai_photo_studio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_photo_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_photo_studio_pgdata:
