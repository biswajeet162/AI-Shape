server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-photo-studio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ai_photo_studio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

ai:
  api-key: ${AI_API_KEY:}
  provider: ${AI_PROVIDER:openai}

storage:
  local:
    path: ${STORAGE_PATH:./storage}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/files}
